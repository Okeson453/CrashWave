# Production compose overlay. Use with base compose or standalone:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# Secrets: prefer Docker secrets / external secret manager over plain env files.
# Never commit real .env production values.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    restart: unless-stopped
    user: "crashapp"
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /app/logs:size=128M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      NODE_ENV: production
      APP_SYSTEM__MODE: dry-run
      METRICS_PORT: "9090"
      # Sensitive values via secrets (see secrets: block) or host env injection
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    secrets:
      - database_url
      - redis_url
      - telegram_bot_token
      - encryption_key
    ports:
      - "9090:9090"
    volumes:
      - app_logs:/app/logs:rw
      - browser_profile:/app/secrets/browser-profile:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${METRICS_PORT:-9090}/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - crash-net

  db:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /var/run/postgresql:size=16M
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: crashautomation
    secrets:
      - postgres_user
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d crashautomation"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - crash-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16M
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes:
      - redis_data:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - crash-net

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus:rw
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - crash-net

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    user: "472:472"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana:rw
    depends_on:
      - prometheus
    networks:
      - crash-net

secrets:
  database_url:
    file: ../secrets/database_url.txt
  redis_url:
    file: ../secrets/redis_url.txt
  telegram_bot_token:
    file: ../secrets/telegram_bot_token.txt
  encryption_key:
    file: ../secrets/encryption_key.txt
  postgres_user:
    file: ../secrets/postgres_user.txt
  postgres_password:
    file: ../secrets/postgres_password.txt
  grafana_admin_password:
    file: ../secrets/grafana_admin_password.txt

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  app_logs:
  browser_profile:

networks:
  crash-net:
    driver: bridge
    internal: false
